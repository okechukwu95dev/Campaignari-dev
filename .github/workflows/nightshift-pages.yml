name: Publish Nightshift

on:
  push:
    branches: [main]
    paths:
      - "nightshift/**"
      - ".github/workflows/nightshift-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightshift-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Nightshift-only site
        shell: bash
        run: |
          mkdir -p _site/nightshift
          cp nightshift/index.html _site/nightshift/index.html
          echo '<!doctype html><meta http-equiv="refresh" content="0;url=nightshift/"><a href="nightshift/">Open Nightshift</a>' > _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
